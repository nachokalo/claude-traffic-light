; ------------------------------------------------------------
;  Claude Traffic Light - configuration
;  Edit with any text editor, then restart the app
;  (tray icon -> Exit, then run claude-traffic-light.exe again)
; ------------------------------------------------------------

[traffic-light]

; Where it appears: right, left, top-right, bottom-right, top-left, bottom-left
position = right

; Distance from the screen edge, in pixels
margin = 26

; Size (100 = normal, 70 = smaller, 140 = bigger). DPI scaling is applied on top.
size_pct = 75

; Height on screen when position is "right" or "left":
;   0 = top edge, 50 = vertically centred, 100 = bottom edge.
; The exact centre sits high enough to be in the way, so the default is lower.
; Ignored when position already says top-* or bottom-*.
vertical_pct = 68

; How long it stays on screen before fading out, in milliseconds
duration_ms = 4000

; Fade timings, in milliseconds
fade_in_ms = 200
fade_out_ms = 450

; Maximum opacity, 0-255. 240 = almost solid, 180 = more discreet.
opacity = 240

; 1 = also show while the Claude window itself is focused
; 0 = only show when you are in another window (recommended)
show_when_focused = 0

; 1 = show as soon as you switch away from the Claude window
; 0 = only show when Claude changes state
show_on_blur = 1

; Lowercase substring that identifies "the Claude window" in its title bar.
; Matches both a terminal running Claude Code and a claude.ai browser tab.
title_match = claude

; Local port the app listens on (127.0.0.1 only).
; If you change it, change it in the userscript/bookmarklet too.
port = 8787
